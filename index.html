        body {
            font-family: 'Nunito', 'ZCOOL KuaiLe', sans-serif;

            font-family: 'ZCOOL KuaiLe', cursive;

        .gachapon-glass {
            background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.9), rgba(255, 255, 255, 0.4) 60%, rgba(253, 164, 175, 0.3));
            box-shadow: inset 0 0 20px rgba(255, 255, 255, 0.8), 0 10px 25px rgba(225, 29, 72, 0.2);

        }

        /* 把手旋转动画 */

            animation: rotateCrank 0.8s ease-in-out;
        }
        @keyframes rotateCrank {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* 扭蛋球掉落动画 */
        @keyframes eggDrop {
            0% { transform: translateY(-120px) scale(0.3) rotate(0deg); opacity: 0; }
            60% { transform: translateY(20px) scale(1.1) rotate(180deg); opacity: 1; }
            80% { transform: translateY(-5px) scale(0.95) rotate(220deg); }
            100% { transform: translateY(0) scale(1) rotate(240deg); opacity: 1; }
        }
        .egg-drop-anim {
            animation: eggDrop 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        /* 扭蛋闪烁摇晃 */
        @keyframes eggShake {
            0%, 100% { transform: rotate(0deg) scale(1); }
            20% { transform: rotate(-8deg) scale(1.05); }
            40% { transform: rotate(8deg) scale(1.05); }
            60% { transform: rotate(-5deg) scale(1.02); }
            80% { transform: rotate(5deg) scale(1.02); }
        }
        .egg-bounce {
            animation: eggShake 1.5s infinite ease-in-out;
        }

        /* 浮动提示 */
        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-50px) scale(1.2); }
        }
        .float-text {
            animation: floatUp 1.2s ease-out forwards;

    <!-- 音效模块 (Web Audio API) -->
    <script>
        let soundEnabled = true;
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;

        function playSound(type) {
            if (!soundEnabled) return;
            if (!audioCtx) audioCtx = new AudioContext();

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            const now = audioCtx.currentTime;

            if (type === 'click') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, now);
                osc.frequency.exponentialRampToValueAtTime(800, now + 0.05);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
                osc.start(now);
                osc.stop(now + 0.05);
            } else if (type === 'crank') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(200, now);
                osc.frequency.linearRampToValueAtTime(500, now + 0.2);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                osc.start(now);
                osc.stop(now + 0.2);
            } else if (type === 'correct') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(523.25, now);
                osc.frequency.setValueAtTime(659.25, now + 0.08);
                osc.frequency.setValueAtTime(783.99, now + 0.16);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.start(now);
                osc.stop(now + 0.3);
            } else if (type === 'wrong') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(220, now);
                osc.frequency.setValueAtTime(160, now + 0.15);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.start(now);
                osc.stop(now + 0.3);
            } else if (type === 'eggPop') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.exponentialRampToValueAtTime(900, now + 0.15);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                osc.start(now);
                osc.stop(now + 0.15);
            }
        }

        function toggleSound() {
            soundEnabled = !soundEnabled;
            const btn = document.getElementById('btn-sound');
            btn.innerHTML = soundEnabled ? '<i class="fa-solid fa-volume-high"></i>' : '<i class="fa-solid fa-volume-xmark"></i>';
        }
    </script>

            { unit: "单元7: 磁铁", q: "弯曲得像英文字母“U”一样的磁铁叫作什么？", options: ["U形磁铁", "环形磁铁", "球形磁铁"], ans: 0, explain: "形状像字母U的磁铁叫U形磁铁。" },
            { unit: "单元7: 磁铁", q: "磁铁能够吸引由什么材料制成的物品？", options: ["铁（铁制品）", "塑料", "木头"], ans: 0, explain: "磁铁只能吸引铁制品。" },
            { unit: "单元7: 磁铁", q: "下列哪种物品会被磁铁吸住？", options: ["铁回形针", "塑料尺", "木橡皮擦"], ans: 0, explain: "铁回形针是铁制品，会被磁铁吸引。" },
            { unit: "单元7: 磁铁", q: "磁铁【不能】吸引下列哪种物品？", options: ["木制铅笔", "铁钉", "铁钥匙"], ans: 0, explain: "木头不是铁制品，磁铁无法吸引。" },
            { unit: "单元7: 磁铁", q: "磁铁有两个极，分别叫作什么？", options: ["北极(N) 和 南极(S)", "东极 和 西极", "左极 和 右极"], ans: 0, explain: "磁铁有 N极（北极）和 S极（南极）。" },
            { unit: "单元7: 磁铁", q: "当两个磁铁【相同】的磁极（如 N 和 N）靠近时，会怎样？", options: ["互相排斥（推开）", "互相吸引（吸住）", "没有变化"], ans: 0, explain: "同性相斥！相同的磁极靠近会互相排斥。" },

            { unit: "单元7: 磁铁", q: "磁铁的哪一部分磁力最强？", options: ["两端的磁极", "中间部位", "到处都一样"], ans: 0, explain: "磁铁两端的磁极（N极和S极）磁力最强！" },

            // --- 单元8：吸水能力 ---
            { unit: "单元8: 吸水能力", q: "洗完手后用棉布毛巾擦手，水分被毛巾吸干了。毛巾属于？", options: ["能吸水的材料", "不能吸水的材料", "会发光的材料"], ans: 0, explain: "棉布毛巾具有吸水能力。" },
            { unit: "单元8: 吸水能力", q: "下雨天穿的【塑料雨衣】会让水渗进来吗？", options: ["不会，塑料不能吸水", "会，塑料吸水很强", "不确定"], ans: 0, explain: "塑料不能吸水，所以用来做雨衣防雨。" },
            { unit: "单元8: 吸水能力", q: "桌子上有水打翻了，用下列哪种物品能最快把水吸干？", options: ["面巾纸/海绵", "塑料尺", "铁匙羹"], ans: 0, explain: "面巾纸和海绵具有极强的吸水能力。" },
            { unit: "单元8: 吸水能力", q: "下列哪种材料是【不能吸水】的？", options: ["塑料和金属", "棉布", "纸张"], ans: 0, explain: "塑料和金属都是不能吸水的材料。" },
            { unit: "单元8: 吸水能力", q: "比较吸水能力：【面巾纸】和【普通书写纸】，谁的吸水能力更强？", options: ["面巾纸", "普通书写纸", "两者一样"], ans: 0, explain: "面巾纸质地疏松，吸水能力比普通书写纸强。" },
            { unit: "单元8: 吸水能力", q: "我们在雨天用的【雨伞】，伞面是用什么材料做的？", options: ["不能吸水的防水布/塑料", "容易吸水的棉布", "纸张"], ans: 0, explain: "雨伞使用不吸水的材料来挡雨。" },
            { unit: "单元8: 吸水能力", q: "妈妈洗完碗后用海绵擦桌子，海绵能吸水是因为？", options: ["海绵是能吸水的材料", "海绵是金属", "海绵是塑料"], ans: 0, explain: "海绵孔隙多，是吸水能力很强的材料。" },
            { unit: "单元8: 吸水能力", q: "玻璃杯装水不会漏出来，因为玻璃是？", options: ["不能吸水的材料", "非常吸水的材料", "柔软的材料"], ans: 0, explain: "玻璃不能吸水也不透水。" }
        ];

        let remainingQuestions = [];

        // 初始化
        window.onload = function() {
            resetGameData();
            renderPlayersGrid();
            renderGachaBallsInGlass();
        };

        // 重置游戏数据
        function resetGameData() {
            players.forEach(p => {
                p.score = 0;
                p.correctCount = 0;
            });
            currentPlayerIndex = 0;
            // 深拷贝并打乱题目顺序
            remainingQuestions = JSON.parse(JSON.stringify(allQuestions));
            shuffleArray(remainingQuestions);
            updateRemainingCount();
        }

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        // 渲染 4 位玩家的名字卡
        function renderPlayersGrid() {
            const grid = document.getElementById('players-grid');
            grid.innerHTML = '';

            players.forEach((p, idx) => {
                const isCurrent = (idx === currentPlayerIndex);
                const card = document.createElement('div');
                card.className = `rounded-2xl p-2.5 sm:p-3 border-2 transition-all relative overflow-hidden ${
                    isCurrent 
                        ? 'bg-gradient-to-b from-pink-100 to-purple-100 border-pink-500 shadow-md scale-105 ring-4 ring-pink-300' 
                        : 'bg-white border-pink-100 opacity-90'
                }`;

                card.innerHTML = `
                    <div class="flex items-center justify-between mb-1">
                        <span class="text-[10px] font-black px-2 py-0.5 rounded-full bg-gradient-to-r ${p.color} text-white shadow-xs">
                            P${idx + 1}
                        </span>
                        <span class="text-xs font-black text-amber-600 flex items-center gap-1">
                            <i class="fa-solid fa-star text-amber-400"></i> ${p.score} 分
                        </span>
                    </div>

                    <!-- 可编辑名字框 -->
                    <input type="text" value="${p.name}" onchange="updatePlayerName(${idx}, this.value)" 
                           class="w-full bg-white/80 border border-pink-200 rounded-lg px-2 py-1 text-xs font-extrabold text-pink-900 focus:outline-none focus:border-pink-500 text-center truncate shadow-inner" 
                           placeholder="输入名字" />

                    <div class="mt-1 text-[10px] text-slate-500 font-bold text-center">
                        答对: <span class="text-pink-600 font-black">${p.correctCount}</span> 题
                    </div>

                    ${isCurrent ? `<div class="absolute top-0 right-0 w-3 h-3 bg-pink-500 rounded-full animate-ping"></div>` : ''}
                `;
                grid.appendChild(card);
            });

            // 更新指示器
            document.getElementById('turn-indicator-badge').innerText = `当前回合: ${players[currentPlayerIndex].name}`;
        }

        function updatePlayerName(idx, newName) {
            if (newName.trim() !== '') {
                players[idx].name = newName.trim();
                renderPlayersGrid();
            }
        }

        // 渲染玻璃罩里的散乱彩蛋
        function renderGachaBallsInGlass() {
            const container = document.getElementById('gacha-balls-container');
            container.innerHTML = '';

            const ballCount = Math.min(remainingQuestions.length, 18);
            for (let i = 0; i < ballCount; i++) {
                const colorObj = eggColors[i % eggColors.length];
                const ball = document.createElement('div');

                // 随机位置与浮动
                const left = 15 + Math.random() * 65;
                const top = 25 + Math.random() * 55;
                const size = 32 + Math.random() * 12;

                ball.className = `absolute rounded-full bg-gradient-to-tr ${colorObj.bg} shadow-md border-2 border-white/60 flex items-center justify-center text-xs opacity-90`;
                ball.style.left = `${left}%`;
                ball.style.top = `${top}%`;
                ball.style.width = `${size}px`;
                ball.style.height = `${size}px`;
                ball.innerText = colorObj.icon;

                container.appendChild(ball);
            }
        }

        // 旋转手柄摇出扭蛋
        function turnCrank() {
            if (isSpinning) return;
            if (remainingQuestions.length === 0) {
                showVictoryModal();
                return;
            }

            isSpinning = true;
            playSound('crank');

            // 手柄动画
            const crank = document.getElementById('gacha-crank-btn');
            crank.classList.add('crank-rotate');

            // 玻璃罩彩蛋抖动
            renderGachaBallsInGlass();

            setTimeout(() => {
                crank.classList.remove('crank-rotate');
                dropEggFromMachine();
            }, 800);
        }

        // 掉落扭蛋
        function dropEggFromMachine() {
            const exitArea = document.getElementById('egg-exit-area');
            playSound('eggPop');

            const randomColor = eggColors[Math.floor(Math.random() * eggColors.length)];

            exitArea.innerHTML = `
                <div id="dropped-egg" onclick="openDroppedEgg()" class="w-12 h-12 rounded-full bg-gradient-to-tr ${randomColor.bg} border-2 border-white shadow-lg cursor-pointer flex items-center justify-center text-lg egg-drop-anim egg-bounce">
                    ${randomColor.icon}
                </div>
            `;

            showFloatText('点击彩蛋开启题目！', window.innerWidth/2, window.innerHeight/2 + 50, 'text-pink-600');
        }

        // 点击开启掉落的扭蛋
        function openDroppedEgg() {
            if (!isSpinning) return;
            playSound('click');

            // 抽取一道题
            currentQuestion = remainingQuestions.pop();
            updateRemainingCount();

            // 清空出口
            document.getElementById('egg-exit-area').innerHTML = '';

            // 打开题目 Modal
            showQuizModal(currentQuestion);
            isSpinning = false;
        }

        // 弹出题目 Modal
        function showQuizModal(q) {
            const modal = document.getElementById('quiz-modal');
            const player = players[currentPlayerIndex];

            document.getElementById('modal-player-badge').innerText = `${player.name} 的题目`;
            document.getElementById('modal-player-badge').className = `bg-gradient-to-r ${player.color} text-white font-black text-xs px-3 py-1 rounded-full shadow-xs`;
            
            document.getElementById('modal-unit-badge').innerText = q.unit;
            document.getElementById('modal-question-text').innerText = q.q;

            const optionsContainer = document.getElementById('modal-options-container');
            optionsContainer.innerHTML = '';

            // 打乱选项顺序
            const optsWithIndex = q.options.map((opt, originalIdx) => ({ text: opt, isCorrect: originalIdx === q.ans }));
            shuffleArray(optsWithIndex);

            optsWithIndex.forEach((item, idx) => {
                const btn = document.createElement('button');
                btn.className = 'w-full bg-white hover:bg-pink-50 text-slate-800 font-extrabold p-3.5 sm:p-4 rounded-2xl border-2 border-pink-200 shadow-sm text-left text-xs sm:text-sm transition flex items-center gap-2.5 active:scale-98';
                btn.innerHTML = `<span class="w-7 h-7 rounded-xl bg-pink-100 text-pink-600 text-xs flex items-center justify-center font-black">${String.fromCharCode(65 + idx)}</span> ${item.text}`;
                btn.onclick = () => checkQuizAnswer(item.isCorrect, q);
                optionsContainer.appendChild(btn);
            });

            document.getElementById('modal-explain-box').classList.add('hidden');
            document.getElementById('modal-next-btn').classList.add('hidden');

            modal.classList.remove('hidden');
        }

        // 检查答案
        function checkQuizAnswer(isCorrect, q) {
            const explainBox = document.getElementById('modal-explain-box');
            const explainTitle = document.getElementById('modal-explain-title');
            const explainText = document.getElementById('modal-explain-text');
            const nextBtn = document.getElementById('modal-next-btn');

            // 禁用选项按钮
            const optionsBtns = document.querySelectorAll('#modal-options-container button');
            optionsBtns.forEach(btn => btn.disabled = true);

            const currentPlayer = players[currentPlayerIndex];

            if (isCorrect) {
                playSound('correct');
                currentPlayer.score += 10;
                currentPlayer.correctCount += 1;

                explainTitle.innerText = `🎉 太棒啦，${currentPlayer.name} 回答正确！`;
                explainTitle.className = "font-bold text-emerald-800 text-xs sm:text-sm";
                explainBox.className = "bg-emerald-50 border-2 border-emerald-300 rounded-2xl p-3.5 mb-4";
                explainText.innerText = `${q.explain} (加 +10 分)`;

                showFloatText('+10 积分！', window.innerWidth/2, window.innerHeight/2 - 80, 'text-emerald-600');
            } else {
                playSound('wrong');
                explainTitle.innerText = `❌ 差一点点，加油哦！`;
                explainTitle.className = "font-bold text-rose-800 text-xs sm:text-sm";
                explainBox.className = "bg-rose-50 border-2 border-rose-300 rounded-2xl p-3.5 mb-4";
                explainText.innerText = `正确答案是：${q.options[q.ans]}。解析：${q.explain}`;
            }

            renderPlayersGrid();
            explainBox.classList.remove('hidden');
            nextBtn.classList.remove('hidden');
        }

        // 关闭题目 Modal 并切换到下一位玩家
        function closeQuizModalAndNext() {
            playSound('click');
            document.getElementById('quiz-modal').classList.add('hidden');

            // 检查是否全答完
            if (remainingQuestions.length === 0) {
                showVictoryModal();
                return;
            }

            // 轮到下一位
            currentPlayerIndex = (currentPlayerIndex + 1) % players.length;
            renderPlayersGrid();
            renderGachaBallsInGlass();
        }

        function updateRemainingCount() {
            document.getElementById('remaining-questions-count').innerText = remainingQuestions.length;
        }

        // 结算模态框
        function showVictoryModal() {
            playSound('correct');
            const leaderboard = document.getElementById('victory-leaderboard');
            leaderboard.innerHTML = '';

            // 按分数降序排列
            const sortedPlayers = [...players].sort((a, b) => b.score - a.score);

            const medals = ['🥇 第一名', '🥈 第二名', '🥉 第三名', '✨ 第四名'];

            sortedPlayers.forEach((p, idx) => {
                const row = document.createElement('div');
                row.className = 'bg-amber-50 border-2 border-amber-200 rounded-2xl p-3 flex items-center justify-between shadow-sm';
                row.innerHTML = `
                    <div class="flex items-center gap-2">
                        <span class="font-extrabold text-xs text-amber-800">${medals[idx]}</span>
                        <span class="font-black text-sm text-pink-700">${p.name}</span>
                    </div>
                    <div class="text-xs font-bold text-amber-900">
                        积分: <strong class="text-amber-600 text-sm">${p.score}</strong> 分 (答对${p.correctCount}题)
                    </div>
                `;
                leaderboard.appendChild(row);
            });

            document.getElementById('victory-modal').classList.remove('hidden');
        }

        function resetGameConfirm() {
            if (confirm("确定要重置所有分数和题目重新开始吗？")) {
                resetGame();
            }
        }

        function resetGame() {
            document.getElementById('victory-modal').classList.add('hidden');
            document.getElementById('quiz-modal').classList.add('hidden');
            document.getElementById('egg-exit-area').innerHTML = '';
            resetGameData();
            renderPlayersGrid();
            renderGachaBallsInGlass();
            isSpinning = false;
        }

        // 飘字特效
        function showFloatText(text, x, y, colorClass = 'text-pink-600') {
            const container = document.getElementById('float-container');
            const el = document.createElement('div');
            el.className = `absolute font-black text-base sm:text-lg ${colorClass} float-text pointer-events-none drop-shadow-md z-50 transform -translate-x-1/2`;
            el.style.left = `${x || window.innerWidth/2}px`;
            el.style.top = `${y || window.innerHeight/2}px`;
            el.innerText = text;

            container.appendChild(el);
            setTimeout(() => el.remove(), 1200);
        }
    </script>
</body>
</html>
